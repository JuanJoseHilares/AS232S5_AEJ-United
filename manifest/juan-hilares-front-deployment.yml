apiVersion: apps/v1
kind: Deployment
metadata:
  name: juan-hilares-frontend-deployment
  labels:
    app: juan-hilares-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juan-hilares-frontend
  template:
    metadata:
      labels:
        app: juan-hilares-frontend
    spec:
      containers:
        - name: frontend
          image: juanhilares/front-react
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: REACT_APP_APIURL
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: REACT_APP_APIURL

          # ------------------------------
          # Readiness Probe (frontend)
          # ------------------------------
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 5

          # ------------------------------
          # Liveness Probe (frontend)
          # ------------------------------
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

        - name: sidecar
          image: busybox
          command: ["sh", "-c", "sleep infinity"]